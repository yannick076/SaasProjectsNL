  var frameBars = [];

  frameBars.forEach(function (m, i) {
    var b = [{ f: [0, 3.2, 0] }, { f: [0, -3.2, 0] }, { f: [-3.4, 0, 0] }, { f: [3.4, 0, 0] }, { f: [0, 0, 3.5] }, { f: [0, 0, -3.5] }][i];

  });
  tl.call(function () { tick(880); }, null, 3.05);

  tl.to(canvas, { opacity: 0, duration: 0.35, ease: 'power2.inOut' }, 6.5);

  tl.fromTo('#rule', { width: 0 }, { width: '22cqw', duration: 0.4, ease: 'power3.out' }, 6.6);
  tl.fromTo('#tagline', { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' }, 6.62);
  tl.set({}, {}, 7.0);
  tl.set(canvas, { opacity: 1 }, 0);

  /* ---------- Render loop: only while playing ---------- */
  var running = false;
  function render() { applyCamera(); renderer.render(scene, camera); }
  function startLoop() { if (!running) { running = true; gsap.ticker.add(render); } }
  function stopLoop() { if (running) { running = false; gsap.ticker.remove(render); render(); } }
  tl.eventCallback('onComplete', function () { setTimeout(stopLoop, 120); });

  function play() {
    if (params.has('t')) { tl.seek(parseFloat(params.get('t')) || 0, false).pause(); render(); return; }
    startLoop();
    if (reduce) { tl.progress(1).pause(); stopLoop(); return; }
    tl.restart();
  }

  /* ---------- Controls ---------- */
  var soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn;
    if (soundOn) { var c = ac(); if (c && c.state === 'suspended') c.resume(); }
    soundBtn.setAttribute('aria-pressed', String(soundOn));
    soundBtn.setAttribute('aria-label', soundOn ? 'Geluid uitzetten' : 'Geluid aanzetten');
    document.getElementById('waves').setAttribute('d', soundOn ? 'M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14' : 'm22 9-6 6M16 9l6 6');
    if (soundOn && !tl.isActive()) play();
  });
  document.getElementById('replay').addEventListener('click', play);

  /* Start: wait for the font so canvas labels use Montserrat */
  var go = function () { resize(); play(); };
  if (document.fonts && document.fonts.load) { document.fonts.load('700 64px Montserrat').then(go, go); } else { go(); }
})();
